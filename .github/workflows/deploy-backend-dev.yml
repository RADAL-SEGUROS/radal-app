# redeploy trigger: 2026-09-09 — re-run after connecting the Blacksmith runner
name: Deploy Backend (dev)

# Builds the backend container image, pushes to ECR, syncs the Lambda env from
# S3, updates the backend Lambda (buffered), and invalidates the /api/* paths.
# Runs ONLY when backend code (or this workflow) changes.
#
# Required GitHub secrets:
#   AWS_ROLE_ARN            -> arn:aws:iam::185011028331:role/radal-github-actions-role (OIDC)
#   AWS_REGION             -> us-east-1
#   ECR_REGISTRY           -> 185011028331.dkr.ecr.us-east-1.amazonaws.com
#   BACKEND_LAMBDA         -> radal-backend-dev
#   S3_BUCKET              -> radal-dev-185011028331  (holds deploy/backend.env)
#   CLOUDFRONT_DISTRIBUTION_ID -> the dev distribution id

on:
  push:
    branches: ["dev"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-dev.yml"
  workflow_dispatch:

# One backend deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-backend-dev
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_TAG: dev-${{ github.sha }}

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2

      # Blacksmith sticky-disk layer cache — big win for the Chromium install layer.
      - name: Set up Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build & push backend image (Lambda-compatible)
        uses: useblacksmith/build-push-action@v2
        with:
          context: ./backend
          push: true
          provenance: false            # Lambda needs a single-arch manifest, no OCI attestation
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REGISTRY }}/radal-backend:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/radal-backend:dev

      - name: Sync backend env from S3 (source of truth)
        run: |
          aws s3 cp s3://${{ secrets.S3_BUCKET }}/deploy/backend.env backend.env
          VARS=$(python3 -c "import json;d=dict(l.strip().split('=',1) for l in open('backend.env') if l.strip() and not l.startswith('#') and '=' in l);print(json.dumps({'Variables':d}))")
          aws lambda update-function-configuration \
            --function-name ${{ secrets.BACKEND_LAMBDA }} --region $AWS_REGION --environment "$VARS"
          aws lambda wait function-updated --function-name ${{ secrets.BACKEND_LAMBDA }} --region $AWS_REGION

      - name: Update backend Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.BACKEND_LAMBDA }} \
            --image-uri $ECR_REGISTRY/radal-backend:$IMAGE_TAG --region $AWS_REGION
          aws lambda wait function-updated --function-name ${{ secrets.BACKEND_LAMBDA }} --region $AWS_REGION
          aws lambda update-function-url-config \
            --function-name ${{ secrets.BACKEND_LAMBDA }} --region $AWS_REGION --invoke-mode BUFFERED

      - name: Invalidate CloudFront (/api/*)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/api/*"
