name: Dev Deploy (Lambda + CloudFront)

# Builds backend + frontend container images, pushes to ECR, updates the Lambda
# functions, and invalidates CloudFront. Mirrors the nirvana pattern.
#
# Required GitHub secrets:
#   AWS_ROLE_ARN            -> arn:aws:iam::185011028331:role/radal-github-actions-role
#                              (GitHub OIDC federation — no long-lived keys)
#   AWS_REGION              -> us-east-1
#   ECR_REGISTRY            -> 185011028331.dkr.ecr.us-east-1.amazonaws.com
#   BACKEND_LAMBDA          -> radal-backend-dev
#   FRONTEND_LAMBDA         -> radal-frontend-dev
#   CLOUDFRONT_DISTRIBUTION_ID -> the dev distribution id
#   S3_BUCKET               -> radal-dev-185011028331  (holds deploy/backend.env)

on:
  push:
    branches: ["dev"]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/dev-deploy.yml"
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_TAG: dev-${{ github.sha }}

jobs:
  backend:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push backend image (Lambda-compatible)
        run: |
          docker buildx build --provenance=false --platform linux/amd64 \
            -t $ECR_REGISTRY/radal-backend:$IMAGE_TAG -t $ECR_REGISTRY/radal-backend:dev --push ./backend
      - name: Sync backend env from S3 (source of truth)
        run: |
          aws s3 cp s3://${{ secrets.S3_BUCKET }}/deploy/backend.env backend.env
          VARS=$(python3 -c "import json;d=dict(l.strip().split('=',1) for l in open('backend.env') if l.strip() and not l.startswith('#') and '=' in l);print(json.dumps({'Variables':d}))")
          aws lambda update-function-configuration \
            --function-name ${{ secrets.BACKEND_LAMBDA }} --region $AWS_REGION --environment "$VARS"
          aws lambda wait function-updated --function-name ${{ secrets.BACKEND_LAMBDA }} --region $AWS_REGION
      - name: Update backend Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.BACKEND_LAMBDA }} \
            --image-uri $ECR_REGISTRY/radal-backend:$IMAGE_TAG --region $AWS_REGION
          aws lambda wait function-updated --function-name ${{ secrets.BACKEND_LAMBDA }} --region $AWS_REGION
          aws lambda update-function-url-config \
            --function-name ${{ secrets.BACKEND_LAMBDA }} --region $AWS_REGION --invoke-mode BUFFERED

  frontend:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push frontend image (Lambda-compatible)
        run: |
          docker buildx build --provenance=false --platform linux/amd64 --build-arg VITE_API_URL=/api/v1 \
            -t $ECR_REGISTRY/radal-frontend:$IMAGE_TAG -t $ECR_REGISTRY/radal-frontend:dev --push ./frontend
      - name: Update frontend Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.FRONTEND_LAMBDA }} \
            --image-uri $ECR_REGISTRY/radal-frontend:$IMAGE_TAG --region $AWS_REGION
          aws lambda wait function-updated --function-name ${{ secrets.FRONTEND_LAMBDA }} --region $AWS_REGION
          aws lambda update-function-url-config \
            --function-name ${{ secrets.FRONTEND_LAMBDA }} --region $AWS_REGION --invoke-mode BUFFERED

  invalidate:
    needs: [backend, frontend]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
