[project]
name = "radal-backend"
version = "0.1.0"
description = "Radal corredora operational backend (FastAPI + SQLAlchemy + SQLite)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<0.116",
    "uvicorn[standard]>=0.30,<0.35",
    "sqlalchemy>=2.0,<2.1",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "python-multipart>=0.0.9,<0.1",
    "email-validator>=2.1,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
