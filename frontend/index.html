<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/radal-mark-teal.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Link previews (WhatsApp, Discord, Slack, iMessage) and search snippets.
         %SITE_URL% is substituted at build time by the radal-site-url plugin in
         vite.config.ts — og:image MUST be absolute or WhatsApp drops the image.
         The card itself is generated by frontend/scripts/generate-og-image.py. -->
    <title>Radal — Plataforma para corredoras de seguros</title>
    <meta
      name="description"
      content="Plataforma operativa para corredoras de seguros en Chile. Reúne antecedentes, compara cotizaciones de aseguradoras y genera propuestas y pólizas en un solo expediente."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0f10" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Radal" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Radal — Conecta la industria del seguro" />
    <meta
      property="og:description"
      content="Plataforma operativa para corredoras de seguros en Chile. Reúne antecedentes, compara cotizaciones de aseguradoras y genera propuestas y pólizas en un solo expediente."
    />
    <meta property="og:image" content="%SITE_URL%/brand/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Radal — Conecta la industria del seguro" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Radal — Conecta la industria del seguro" />
    <meta
      name="twitter:description"
      content="Plataforma operativa para corredoras de seguros en Chile. Reúne antecedentes, compara cotizaciones de aseguradoras y genera propuestas y pólizas en un solo expediente."
    />
    <meta name="twitter:image" content="%SITE_URL%/brand/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Space+Grotesk:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
